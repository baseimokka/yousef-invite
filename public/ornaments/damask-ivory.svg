<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Tone-on-tone ivory damask. Deliberately very low contrast: in the
       reference it reads as texture, never as pattern. -->
  <defs>
    <g id="motif">
      <path d="M0,-52 C14,-34 26,-20 26,-4 C26,12 14,22 0,30 C-14,22 -26,12 -26,-4 C-26,-20 -14,-34 0,-52 Z"/>
      <path d="M0,-30 C7,-19 13,-11 13,-3 C13,5 7,11 0,15 C-7,11 -13,5 -13,-3 C-13,-11 -7,-19 0,-30 Z" fill="#fbf7ef" fill-opacity="0.9"/>
      <path d="M0,30 C10,40 22,44 34,42 C30,54 18,60 4,58 C8,48 6,38 0,30 Z"/>
      <path d="M0,30 C-10,40 -22,44 -34,42 C-30,54 -18,60 -4,58 C-8,48 -6,38 0,30 Z"/>
      <path d="M-26,-4 C-42,-10 -54,-4 -60,8 C-48,14 -36,12 -28,4 Z"/>
      <path d="M26,-4 C42,-10 54,-4 60,8 C48,14 36,12 28,4 Z"/>
      <ellipse cx="0" cy="-58" rx="5" ry="8"/>
      <circle cx="-46" cy="18" r="3.5"/>
      <circle cx="46" cy="18" r="3.5"/>
    </g>
    <g id="sprig">
      <path d="M0,0 C8,-10 10,-22 6,-34 C0,-26 -4,-14 0,0 Z"/>
      <path d="M0,0 C-8,-10 -10,-22 -6,-34 C0,-26 4,-14 0,0 Z"/>
      <circle cx="0" cy="-38" r="3"/>
    </g>
  </defs>

  <g fill="#f2ebdb" fill-opacity="0.2">
    <!-- Centre medallion -->
    <use href="#motif" transform="translate(150 150)"/>

    <!-- Corner quarters keep the tile seamless -->
    <use href="#motif" transform="translate(0 0)"/>
    <use href="#motif" transform="translate(300 0)"/>
    <use href="#motif" transform="translate(0 300)"/>
    <use href="#motif" transform="translate(300 300)"/>

    <!-- Edge sprigs break up the grid so it does not read as a checkerboard -->
    <use href="#sprig" transform="translate(150 60) rotate(180)"/>
    <use href="#sprig" transform="translate(150 240)"/>
    <use href="#sprig" transform="translate(60 150) rotate(90)"/>
    <use href="#sprig" transform="translate(240 150) rotate(-90)"/>
  </g>
</svg>
